spring:
  datasource:
    url: jdbc:h2:mem:wctest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS wc
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: wc
  flyway:
    enabled: true
    schemas: wc
    default-schema: wc

colign:
  auth:
    mode: mock
    audience: https://api.colign.org
