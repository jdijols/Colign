spring:
  application:
    name: colign-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wc}
    username: ${DB_USER:wc}
    password: ${DB_PASS:wc}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_schema: wc
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: wc
    default-schema: wc
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

# --- WC auth mode ---
# Two modes for Auth0 JWT validation:
#   real  → validate against the configured Auth0 issuer-uri + JWKS
#   mock  → validate against a hardcoded RS256 public key (scripts/mock-jwt.sh issues tokens)
colign:
  auth:
    mode: ${COLIGN_AUTH_MODE:mock}
    audience: ${COLIGN_AUTH_AUDIENCE:https://api.colign.org}
    mock:
      # Demo-only public key. Paired private key in scripts/mock-jwt.sh.
      public-key-pem: |
        -----BEGIN PUBLIC KEY-----
        REPLACE_WITH_REAL_KEY_IN_SLOT_3
        -----END PUBLIC KEY-----
    real:
      issuer-uri: ${COLIGN_AUTH0_ISSUER:https://YOUR_TENANT.us.auth0.com/}
      jwk-set-uri: ${COLIGN_AUTH0_JWKS:https://YOUR_TENANT.us.auth0.com/.well-known/jwks.json}
  email:
    # Resend API key (https://resend.com). Read from the RESEND_API_KEY env var,
    # which is sourced from apps/colign-backend/.env.local (gitignored) at boot.
    # Blank → emails are logged instead of sent, so the invitation flow still
    # works end-to-end without an outbound provider configured.
    resend-api-key: ${RESEND_API_KEY:}
    # FROM address. Defaults to Resend's sandbox sender; override via RESEND_FROM
    # once the colign.org domain is verified in the Resend dashboard.
    from: ${RESEND_FROM:Colign <onboarding@resend.dev>}
  cors:
    # Browser origins allowed to call the API directly (comma-separated). Dev
    # defaults cover the host/remote/standalone Vite ports. In prod set
    # COLIGN_CORS_ORIGINS to the deployed frontend origin (e.g.
    # https://app.colign.org). Note: when the frontend proxies /api via a
    # same-origin rewrite, no browser CORS is triggered for those calls — this
    # is defense-in-depth for any direct cross-origin call.
    allowed-origins: ${COLIGN_CORS_ORIGINS:http://localhost:4173,http://localhost:5173,http://localhost:5174,http://localhost:3000}
  app:
    # Base URL the invitation accept link is built against. The controller
    # appends "/invite/{token}". For pa-host on dev that's :4173/weekly-commit
    # because the colign remote is mounted at /weekly-commit/*. Swap to a
    # public origin (e.g. https://app.colign.org/weekly-commit) for prod.
    base-url: ${COLIGN_APP_BASE_URL:http://localhost:4173/weekly-commit}
  invitations:
    # Days a pending invitation stays valid. After this it returns 410 GONE
    # on preview/accept and the invitee must request a fresh one.
    expiry-days: ${COLIGN_INVITE_EXPIRY_DAYS:14}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.colign: DEBUG
    org.hibernate.SQL: INFO
