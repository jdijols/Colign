spring:
  datasource:
    url: jdbc:h2:mem:wctest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: WC
  flyway:
    enabled: true
    schemas: WC
    default-schema: WC

wc:
  auth:
    mode: mock
