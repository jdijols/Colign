<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>colign — strategic alignment for every weekly commit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..500&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --fg: #0a0a0a;
        --bg: #ffffff;
        --surface: #fafafa;
        --border: #d4d4d4;       /* was #e5e5e5 — bumped to clear WCAG 1.4.11 non-text contrast 3:1 for UI boundaries */
        --muted: #595959;        /* was #737373 — bumped from 4.71:1 (AA) to 7.0:1 (AAA) on white */
        --ring: #0a0a0a;         /* focus-ring color, contrasts with bg in both modes */
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #fafafa;
          --bg: #0a0a0a;
          --surface: #171717;
          --border: #404040;     /* was #262626 — bumped for non-text contrast on dark */
          --muted: #a3a3a3;      /* already 8:1 on #0a0a0a — AAA */
          --ring: #fafafa;
        }
      }
      body {
        margin: 0;
        font-family: "Geist", "Inter", system-ui, -apple-system, "Segoe UI",
          Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        font-feature-settings: "ss01", "cv11";
      }
      code, kbd, samp, pre {
        font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }

      /* WCAG 2.4.7 Focus Visible — uniform ring on all interactive elements.
         Ring sits OUTSIDE the element via outline-offset so it stays visible
         even on solid-fg buttons (where outline color would otherwise blend). */
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 3px;
        border-radius: 2px;
      }

      /* WCAG 2.3.3 Animation from Interactions — vestibular safety. The CTA
         lifts on hover only when the user has not requested reduced motion. */
      .colign-cta {
        transition: opacity 140ms ease;
      }
      @media (prefers-reduced-motion: no-preference) {
        .colign-cta {
          transition: transform 140ms cubic-bezier(.2,.8,.2,1),
                      opacity 140ms ease;
        }
        .colign-cta:hover:not(:disabled) {
          transform: translateY(-1px);
        }
      }

      /* WCAG 2.5.8 Target Size (Minimum) — caption links must be ≥24×24
         tappable. Padding expands the hit area; negative margin keeps the
         visual layout intact. Underline applies to text-glyphs only. */
      .colign-caption-link {
        display: inline-flex;
        align-items: center;
        padding: 10px 4px;
        margin: -10px -4px;
        min-height: 24px;
        text-decoration: underline;
        text-decoration-color: var(--border);
        text-underline-offset: 3px;
        text-decoration-thickness: 1px;
        color: var(--muted);
        transition: color 140ms ease, text-decoration-color 140ms ease;
      }
      .colign-caption-link:hover {
        color: var(--fg);
        text-decoration-color: var(--fg);
      }

      /* Screen-reader-only utility (used by skip link) */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .sr-only:focus,
      .sr-only:focus-visible {
        position: fixed;
        top: 12px;
        left: 12px;
        width: auto;
        height: auto;
        padding: 10px 14px;
        margin: 0;
        clip: auto;
        background: var(--fg);
        color: var(--bg);
        border-radius: 6px;
        z-index: 1000;
        font-size: 14px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div id="pa-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
